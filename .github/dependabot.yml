# Weekly update pull requests for the npm packages and the GitHub Actions the
# workflow uses, grouped so each week brings at most one PR per ecosystem. They
# run the same checks as any PR and wait for the owner to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
