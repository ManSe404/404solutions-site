# Weekly update pull requests for the npm packages and the GitHub Actions the
# workflow uses, grouped so each week brings at most one PR per ecosystem. They
# run the same checks as any PR and wait for the owner to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @astrojs/check accepts TypeScript 5 and 6 only; a TypeScript 7 bump
      # fails `npm ci` and with it the whole group. Lift when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Node types follow the Node the workflow runs (24), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
